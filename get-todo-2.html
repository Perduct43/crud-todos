<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    input::placeholder {
        color: grey;
        font-size: medium;
    }
</style>

<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; border-radius: 8px;">
    <div style="display: flex; justify-content: center;">
        <div
            style="display: flex; flex-direction: column; gap: 20px; padding: 30px; border: none; box-shadow: 5px 5px 5px 5px grey; width: 550px; border-radius: 12px;">
            <h1>JSON Todo Loader</h1>
            <input 
                style="width: 500px; height: 55px; border-radius: 8px; box-shadow:3px 3px 3px 3px rgb(201, 198, 198); border: none;"
                placeholder="Enter ID e.g. 1" type="text" name="" id="todoid">
            <button onclick="gettodobyid()"
                style="background-color: #6200EA; border: none; border-radius: 8px; height: 55px; width: 500px; font-size: 15px; color: white; font-weight: 600;">Get
                Single Todo</button>
            <button onclick="getalltodo()"
                style="background-color: #6200EA; border: none; border-radius: 8px; height: 55px; width: 500px; font-size: 15px; color: white; font-weight: 600;">Get
                All Todos</button>
                <div id="todoitem">

                </div>
        </div>
    </div>
</body>
<script>
    const inputvalue = document.getElementById("todoid");
    const todo = document.getElementById("todoitem");
    async function getalltodo() {
        try {
            const response = await fetch("https://dummyjson.com/products");
            const data = await response.json();
            todo.innerHTML = data.products.map((item)=>(`
            <div style="width: 300px; height: 650px; border-radius: 12px; box-shadow: 5px 5px 5px 5px grey; padding: 20px; gap: 20px; background-color: white;">\
        <img src="${item.thumbnail}" alt="">
        <h2 style="color: grey;">BEAUTY</h2>
        <h1>${item.title}</h1>
        <h2 style="color: green">$${item.price}</h2>
        <p>🗿⭐${item.rating}/5</p>
        <button style="background-color: rgb(67, 114, 235); border: none; width: 230px; height: 50px; border-radius: 8px;color: white;">
            <h3>Add to cart</h3>
        </button>
    </div>
            `)).join('');
        } catch (error) {
            console.log("this is the error", error)
        }
    }

    async function gettodobyid() {
        const id = inputvalue.value
        try {
            const res = await fetch(`https://dummyjson.com/products/${id}`)
            if(!res.ok) {
                throw new Error ("this is the error from !res")
            }
            const thejson = await res.json();
            todo.innerHTML = `
            <div style="width: 300px; height: 650px; border-radius: 12px; box-shadow: 5px 5px 5px 5px grey; padding: 20px; gap: 20px; background-color: white;">\
        <img src="${thejson.thumbnail}" alt="">
        <h2 style="color: grey;">BEAUTY</h2>
        <h1>${thejson.title}</h1>
        <h2 style="color: green">$${thejson.price}</h2>
        <p>🗿⭐${thejson.rating}/5</p>
        <button style="background-color: rgb(67, 114, 235); border: none; width: 230px; height: 50px; border-radius: 8px;color: white;">
            <h3>Add to cart</h3>
        </button>
    </div>
            `
            console.log("this is the json",thejson)
        } catch (err) {
            console.log("the error is", err)
        }
    }
</script>

</html>
